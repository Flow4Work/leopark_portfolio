<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="ttl desc"><title id="ttl">Tonament 제품과 토큰 전략 검토 구조</title><desc id="desc">제품 개선과 제품 마케팅, 토큰 자금 모집과 토큰 마케팅을 함께 검토한 당시 기획 구조. IEO와 IDO, 내러티브, 시장 타이밍, KOL 전략, 이벤트를 검토 항목으로 보여준다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="6.7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#86909d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif"><rect width="1120" height="780" rx="18" fill="#fff"/><rect x="23" y="20" width="1074" height="740" rx="13" fill="#fff" stroke="#e7e8ed" stroke-width="1"/><rect x="48" y="93" width="165" height="53" rx="9" fill="#fff" stroke="#b9c0c9" stroke-width="1.4"/><text x="130.5" y="125.5" fill="#25272e" font-size="19" font-weight="550" text-anchor="middle">Product</text><rect x="48" y="348" width="165" height="53" rx="9" fill="#e7373d" stroke="#e7373d" stroke-width="1.4"/><text x="130.5" y="380.5" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Token</text><path d="M130 146V345" fill="none" stroke="#aeb4bc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="35" y="225" width="195" height="29" rx="6" fill="#f5f6f8"/><text x="132" y="246" fill="#626a75" font-size="15" font-weight="600" text-anchor="middle">제품과 토큰의 유기적 관계</text><path d="M213 120H243V80H267" fill="none" stroke="#86909d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M243 120V165H267" fill="none" stroke="#86909d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="267" y="53" width="188" height="54" rx="9" fill="#fff" stroke="#b9c0c9" stroke-width="1.4"/><text x="361" y="86" fill="#25272e" font-size="19" font-weight="550" text-anchor="middle">제품 개선</text><rect x="267" y="138" width="188" height="54" rx="9" fill="#fff" stroke="#b9c0c9" stroke-width="1.4"/><text x="361" y="171" fill="#25272e" font-size="19" font-weight="550" text-anchor="middle">마케팅</text><text x="483" y="75" fill="#d82f35" font-size="18" font-weight="650" text-anchor="start">제품과 연결된 토큰 사용처 설계</text><text x="483" y="105" fill="#656b75" font-size="16" font-weight="450" text-anchor="start">투표, 랭킹, 래플, 광고 노출 구매 등</text><text x="483" y="170" fill="#25272e" font-size="17" font-weight="450" text-anchor="start">제품 자체를 알리는 마케팅</text><path d="M213 375H245V290H267" fill="none" stroke="#86909d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M245 375V489H267" fill="none" stroke="#86909d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="267" y="263" width="188" height="54" rx="9" fill="#fff" stroke="#b9c0c9" stroke-width="1.4"/><text x="361" y="296" fill="#25272e" font-size="19" font-weight="550" text-anchor="middle">자금 모집</text><rect x="267" y="462" width="188" height="54" rx="9" fill="#e7373d" stroke="#e7373d" stroke-width="1.4"/><text x="361" y="495" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">토큰 마케팅</text><path d="M455 290H495V245H515" fill="none" stroke="#86909d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M495 290V327H515" fill="none" stroke="#86909d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="515" y="220" width="180" height="54" rx="9" fill="#fff" stroke="#b9c0c9" stroke-width="1.4"/><text x="605" y="253" fill="#25272e" font-size="19" font-weight="550" text-anchor="middle">IEO</text><rect x="515" y="300" width="180" height="54" rx="9" fill="#e7373d" stroke="#e7373d" stroke-width="1.4"/><text x="605" y="333" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">IDO</text><text x="725" y="253" fill="#25272e" font-size="17" font-weight="450" text-anchor="start">CEX를 통한 자금 모집</text><text x="725" y="333" fill="#25272e" font-size="17" font-weight="450" text-anchor="start">DEX를 통한 자금 모집</text><text x="267" y="550" fill="#6c7580" font-size="17" font-weight="450" text-anchor="start">펀드레이징을 위한 관심과 기대감 형성</text><path d="M455 489H493V427H515" fill="none" stroke="#86909d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M493 489V507H515" fill="none" stroke="#86909d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M493 507V587H515" fill="none" stroke="#86909d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M493 587V667H515" fill="none" stroke="#86909d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="515" y="401" width="180" height="54" rx="9" fill="#e7373d" stroke="#e7373d" stroke-width="1.4"/><text x="605" y="434" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">네러티브</text><rect x="515" y="481" width="180" height="54" rx="9" fill="#fff" stroke="#b9c0c9" stroke-width="1.4"/><text x="605" y="514" fill="#25272e" font-size="19" font-weight="550" text-anchor="middle">시장 타이밍</text><rect x="515" y="561" width="180" height="54" rx="9" fill="#fff" stroke="#b9c0c9" stroke-width="1.4"/><text x="605" y="594" fill="#25272e" font-size="19" font-weight="550" text-anchor="middle">KOL 전략</text><rect x="515" y="641" width="180" height="54" rx="9" fill="#fff" stroke="#b9c0c9" stroke-width="1.4"/><text x="605" y="674" fill="#25272e" font-size="19" font-weight="550" text-anchor="middle">이벤트</text><text x="725" y="423" fill="#d82f35" font-size="17" font-weight="630" text-anchor="start">강한 내러티브와 시장 기대감</text><text x="725" y="449" fill="#5d646d" font-size="15" font-weight="450" text-anchor="start">토큰 가치에 대한 인식 형성</text><text x="725" y="503" fill="#25272e" font-size="17" font-weight="450" text-anchor="start">예측보다 사전 준비와 대응</text><text x="725" y="529" fill="#5d646d" font-size="15" font-weight="450" text-anchor="start">상황에 맞춰 실행 시점 판단</text><text x="725" y="583" fill="#25272e" font-size="17" font-weight="450" text-anchor="start">KOL 영향력 및 적합성 검토</text><text x="725" y="609" fill="#5d646d" font-size="15" font-weight="450" text-anchor="start">효과 측정 방식에 대한 고민</text><text x="725" y="663" fill="#25272e" font-size="17" font-weight="450" text-anchor="start">밈, 커뮤니티 챌린지</text><text x="725" y="689" fill="#5d646d" font-size="15" font-weight="450" text-anchor="start">공동 이벤트 등 참여 유도</text></g></svg>