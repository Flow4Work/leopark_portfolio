<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scout 제품 흐름 데모</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b09;color:#f7f7ee;font-family:Arial,"Malgun Gothic",sans-serif;overflow:hidden}button{font:inherit}.viewport{position:absolute;inset:0;overflow:hidden}#canvas{position:absolute;width:1200px;height:700px;transform-origin:top left}.camera{width:1200px;height:700px;transform-origin:0 0;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}.bar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;border-bottom:1px solid #303026}.brand{font-size:19px;font-weight:750;display:flex;align-items:center;gap:10px}.brand img{width:39px;height:39px;object-fit:contain}.bar small{color:#bdb58f;font-size:12px}.layout{display:grid;grid-template-columns:205px 570px 1fr;gap:14px;padding:18px;height:586px}.panel{background:#11120f;border:1px solid #33342b;border-radius:13px;overflow:hidden}.aside{padding:19px 17px}.aside h2{font-size:15px;margin:0 0 18px}.tag{display:inline-block;background:#232317;color:#d8c777;border:1px solid #44412a;border-radius:6px;padding:6px 8px;font-size:10px}.metric{padding:23px 0;border-bottom:1px solid #303026;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#c0c0ac}.metric b{font-size:30px;color:#fff;font-variant-numeric:tabular-nums}.metric.target b{color:#f4d35f}.metric.target{position:relative}.plus{position:absolute;right:0;top:0;font-size:24px;color:#f5d35e;font-weight:bold;opacity:0}.activity{font-size:11px;line-height:2.1;color:#939582;margin-top:19px}.activity b{color:#dfd198}.workspace-top{height:70px;display:flex;gap:10px;align-items:center;padding:0 14px;border-bottom:1px solid #33342b}.pill{border:1px solid #57503c;border-radius:25px;font-size:12px;padding:10px 14px;background:#252117;color:#f4df9c}.search{margin-left:auto;font-size:11px;color:#929482;background:#24251f;border:1px solid #34362d;padding:12px 14px;border-radius:7px}.table-head,.row{display:grid;grid-template-columns:29px 1fr 74px 103px;gap:8px;align-items:center}.table-head{height:38px;padding:0 14px;color:#a9ab98;font-size:11px;border-bottom:1px solid #33342b}.list{height:431px;overflow:hidden}.row{height:39px;padding:0 14px;border-bottom:1px solid #24261e;font-size:11px}.row .check{border:1px solid #555642;border-radius:3px;width:12px;height:12px}.name b{font-weight:600;color:#f3f3e9}.name small{font-size:9px;color:#939684;margin-left:6px}.row .badge{justify-self:start;color:#dec47a;font-size:9px;background:#282317;border:1px solid #463b23;border-radius:5px;padding:4px 6px}.row.new{background:#29281788;animation:insert .45s ease both}.row.new .badge{color:#f8e498;background:#3f351c}.foot{font-size:10px;color:#929482;padding:10px 14px;border-top:1px solid #33342b;display:flex;justify-content:space-between}.chat-head{padding:20px 17px;border-bottom:1px solid #33342b}.chat-head b{font-size:17px}.chat-head small{font-size:11px;color:#969985;display:block;margin-top:9px}.suggest{padding:14px 13px;display:flex;gap:6px}.suggest span{font-size:9px;color:#c6c4aa;border:1px solid #393a2c;background:#23241b;border-radius:18px;padding:9px}.messages{padding:10px 15px;height:335px;overflow:hidden}.greeting{font-size:12px;line-height:1.8;color:#d4d6c3;display:flex;gap:9px}.greeting img{width:30px;height:30px;object-fit:contain;flex:none}.bubble{margin:15px 0 0 auto;background:#32301e;border:1px solid #4b452a;border-radius:11px 11px 2px 11px;font-size:12px;line-height:1.8;padding:11px 13px;max-width:250px}.response{margin-top:17px;font-size:12px;line-height:1.95;white-space:pre-wrap;color:#e6e7d6}.response small{color:#d8c67a;font-size:10px}.composer{margin:9px 12px 0;padding:13px;background:#25261d;border:1px solid #494933;border-radius:10px;display:flex;align-items:center;gap:9px;min-height:57px}.composer span{font-size:12px;color:#f3eed2;flex:1}.composer b{display:grid;place-items:center;color:#17170f;background:#e5c955;border-radius:50%;width:30px;height:30px;font-size:19px}.caret::after{content:"";display:inline-block;background:#e6cd65;width:1px;height:13px;vertical-align:middle;margin-left:2px;animation:blink .7s infinite}.demo-eagle{position:absolute;z-index:10;left:-100px;top:75px;width:94px;height:94px;object-fit:contain;opacity:0;filter:drop-shadow(0 0 10px #e8cc4a55)}.flying .demo-eagle{animation:flight 1.8s ease-in-out both}.flying .plus{animation:increment 3s .9s ease both}.story{display:none!important;position:absolute;left:20px;right:20px;bottom:14px;padding:12px 17px;background:#1d1d15;border:1px solid #393a29;border-radius:9px;display:flex;align-items:center;justify-content:space-between;font-size:13px}.story b{color:#eed57b;font-weight:600}.story small{font-size:10px;color:#aaa891}.dots span{width:5px;height:5px;background:#c8bc79;display:inline-block;border-radius:50%;margin:0 2px;animation:blink 1s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}.legacy{color:#202532;background:#f4f6f8}.legacy .bar{background:#fff;border-color:#d9dde5}.legacy .brand{font-size:20px}.legacy .bar small{color:#65809b}.legacy-body{padding:23px 30px}.legacy-stats{display:flex;align-items:center;gap:24px;padding:18px 22px;background:white;border-radius:11px;box-shadow:0 4px 18px #283b5010;font-size:13px}.legacy-stats b{color:#245ede;font-size:22px;margin-left:5px}.legacy-tools{display:flex;justify-content:space-between;align-items:center;margin:17px 0;background:white;border-radius:12px;padding:15px 19px}.legacy-tools strong{font-size:14px}.legacy-tools span{font-size:12px;color:#6f7989}.legacy-tools .add{background:#2d73e5;color:white;padding:10px 16px;border-radius:7px}.legacy-table{border:1px solid #dde1e8;border-radius:12px;overflow:hidden;background:white}.legacy-head,.legacy-row{display:grid;grid-template-columns:32px 230px 125px 155px 1fr 125px;gap:10px;align-items:center;padding:0 20px}.legacy-head{background:#fafbfc;font-size:11px;color:#818b99;height:42px}.legacy-row{height:55px;border-top:1px solid #edf0f4;font-size:12px}.legacy-row b{color:#255fc0;font-size:12px}.legacy-row small{color:#929eae}.legacy-row em{font-style:normal;background:#f4f1d6;color:#8e7b2b;padding:5px 7px;border-radius:6px;font-size:10px;justify-self:start}.legacy-row.new{animation:insert .6s both;background:#eef6ff}.legacy-caption{position:absolute;bottom:20px;left:30px;font-size:11px;color:#74849b}.legacy .story{background:#fff;border-color:#dce2e9;color:#455570}.legacy .story b{color:#225fc1}.legacy .story small{color:#7a8799}
@keyframes insert{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{50%{opacity:.25}}@keyframes increment{0%{opacity:0;transform:translateY(22px)}30%,75%{opacity:1;transform:translateY(-2px)}100%{opacity:0;transform:translateY(-20px)}}@keyframes flight{0%{opacity:0;transform:translate(0,60px) rotate(-15deg)}20%{opacity:1}60%{transform:translate(290px,-10px) rotate(4deg);opacity:1}90%{opacity:1}100%{opacity:0;transform:translate(185px,105px) scale(.3)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="viewport"><div id="canvas"><div class="camera" id="camera"></div><div class="story"><b id="story">01 · 새 후보가 도착합니다</b><small>제품 흐름 재현 · 예시 계정 / 예시 응답</small></div></div></div><script>
(()=>{
const mode=new URLSearchParams(location.search).get('mode')||'current',canvas=document.getElementById('canvas'),camera=document.getElementById('camera'),reduced=matchMedia('(prefers-reduced-motion:reduce)'),legacy=mode!=='current';let tasks=[],paused=false,running=false,visible=true;
function resize(){const scale=Math.min(innerWidth/1200,innerHeight/700);canvas.style.transform='scale('+scale+')';canvas.style.left=(innerWidth-1200*scale)/2+'px';canvas.style.top=(innerHeight-700*scale)/2+'px'}new ResizeObserver(resize).observe(document.body);addEventListener('resize',resize);resize();
function later(fn,ms){tasks.push(setTimeout(fn,ms))}function clear(){tasks.forEach(clearTimeout);tasks=[]}function story(text){document.getElementById('story').textContent=text}function type(el,text,done){let n=0;function step(){el.textContent=text.slice(0,++n);if(n<text.length)later(step,45);else if(done)done()}step()}
const currentHTML=`<div class="bar"><div class="brand"><img src="kol-scout-eagle.png" alt="">Influencer Scout</div><small>● 일본 후보 자동 갱신</small></div><div class="layout"><aside class="panel aside"><h2>현황 및 완료 내역</h2><span class="tag">● 신규 후보 확인</span><div class="metric">대만 후보 <b>384</b></div><div class="metric target">일본 후보 <b id="count">393</b><span class="plus">+10</span></div><div class="activity"><b>저장 활동</b><br>방금 · 새 후보를 기다리는 중<br>기존 목록과 중복 확인</div></aside><section class="panel"><div class="workspace-top"><span class="pill">🇯🇵 일본 <b id="pill-count">393</b></span><span class="search">⌕ 이름, Instagram ID</span></div><div class="table-head"><span>□</span><span>크리에이터</span><span>팔로워</span><span>검토 상태</span></div><div class="list" id="list"></div><div class="foot"><span>후보 목록 · 예시 데이터</span><span id="list-note">기존 후보</span></div></section><section class="panel"><div class="chat-head"><b>Scout 대화창</b><small>후보 분석 및 메시지 작성</small></div><div class="suggest"><span>일본 20K 이상</span><span>협업 DM 작성</span></div><div class="messages"><div class="greeting"><img src="kol-scout-eagle.png" alt=""><span>안녕하세요, Scout예요.<br>찾고 싶은 후보나 메시지를 알려주세요.</span></div><div id="question"></div><div class="response" id="answer"></div></div><div class="composer"><span id="input">메시지를 입력하세요</span><b>↑</b></div></section></div><img src="kol-scout-eagle.png" class="demo-eagle" alt="">`;
function row(n,isNew){const el=document.createElement('div');el.className='row'+(isNew?' new':'');el.innerHTML='<span class="check"></span><span class="name"><b>@'+(isNew?'new_creator_':'creator_')+String(n).padStart(2,'0')+'</b></span><span>'+ (30+n*2)+'.'+n%10+'K</span><span class="badge">'+(isNew?'새 후보':'검토 대기')+'</span>';return el}
function current(){camera.className='camera';camera.innerHTML=currentHTML;camera.style.transform='none';for(let n=1;n<10;n++)document.getElementById('list').append(row(n,false));story('01 · 독수리가 새 후보 소식을 전합니다');if(reduced.matches)return;
 later(()=>camera.classList.add('flying'),250);later(()=>{camera.style.transform=innerWidth<600?'translate(-40px,-155px) scale(1.85)':'translate(-20px,-35px) scale(1.14)';story('02 · 일본 후보 +10 · 393 → 403');let n=393;function count(){document.getElementById('count').textContent=++n;document.getElementById('pill-count').textContent=n;if(n<403)later(count,65)}count()},1300);
 later(()=>{camera.style.transform=innerWidth<600?'translate(-200px,-40px) scale(1.3)':'translate(-120px,-45px) scale(1.13)';story('03 · 새 계정 10개가 목록에 추가됩니다');let n=1;function insert(){document.getElementById('list').prepend(row(n,true));document.getElementById('list-note').textContent='새 후보 '+n+'명 추가';if(n++<10)later(insert,210)}insert()},3100);
 later(()=>{camera.style.transform=innerWidth<600?'translate(-1710px,-740px) scale(2.45)':'translate(-500px,-44px) scale(1.42)';story('04 · 후보를 고른 다음, 대화로 작업 요청');const input=document.getElementById('input');input.className='caret';type(input,'새 일본 후보 10명의 협업 제안 DM을 써줘.',()=>{input.className='';later(()=>{const q=document.getElementById('question');q.className='bubble';q.textContent=input.textContent;if(innerWidth<600)camera.style.transform='translate(-1710px,-500px) scale(2.45)';input.textContent='메시지를 입력하세요';document.getElementById('answer').innerHTML='<span class="dots"><span></span><span></span><span></span></span>';story('05 · 요청에 맞춰 메시지 초안을 준비합니다');later(()=>type(document.getElementById('answer'),`10명의 후보를 확인했어요.
후보별 콘텐츠를 검토할 수 있도록,
공통 제안 구조부터 준비했어요.

こんにちは。韓国でのコラボについて
ご相談したく、ご連絡しました。

초안을 검토한 뒤 실제 제안 내용을
후보별로 다듬어 주세요.`),1000)},450)})},6400);
 later(()=>{camera.style.transform='none';story('06 · 후보 도착부터 메시지 초안까지, 한 흐름으로')},19000);later(start,23500)}
function legacyHTML(){let core=mode==='core';camera.className='camera legacy';camera.innerHTML='<div class="bar"><div class="brand">'+(core?'KOL Scout':'FixUp Scout')+'</div><small>'+(core?'대만 공동구매 후보 · 운영 도구':'일본 후보 · 내부 운영 도구')+'</small></div><div class="legacy-body"><div class="legacy-stats"><span>누적 후보 <b id="legacy-total">'+(core?'573':'40')+'</b></span><span>검토 대기 <b>13</b></span><span>추천 후보 <b>11</b></span><span>완료 기록 <b>1</b></span></div><div class="legacy-tools"><strong>'+(core?'공동구매 이력 · 팔로워 · 제품 적합성':'💄 미용　 🍜 맛집')+'</strong><span>전체　 |　 후보　 |　 완료</span><span class="add">+ 후보 추가</span></div><div class="legacy-table"><div class="legacy-head"><span>□</span><span>Instagram</span><span>상태</span><span>팔로워</span><span>확인 근거</span><span>작업</span></div><div id="legacy-rows"></div></div></div>';for(let n=1;n<7;n++)document.getElementById('legacy-rows').append(legacyRow(n,false));story(core?'대만 V2 · 업무에 필요한 기능부터 먼저':'일본 V1 · 나 혼자 쓰는 도구에서 시작');if(reduced.matches)return;later(()=>{let n=1;function add(){document.getElementById('legacy-rows').prepend(legacyRow(n,true));document.getElementById('legacy-total').textContent=(core?573:40)+n;if(n++<3)later(add,650)}add();story('새 후보가 쌓이면, 상태와 근거를 한 줄에서 확인')},2300);later(start,10000)}
function legacyRow(n,newItem){let el=document.createElement('div');el.className='legacy-row'+(newItem?' new':'');el.innerHTML='<span>□</span><b>@'+(newItem?'new_':'')+(mode==='core'?'tw_':'jp_')+'creator_0'+n+'</b><em>'+(newItem?'새 후보':'검토 대기')+'</em><span>'+(30+n*7)+',000</span><span>'+(mode==='core'?'공동구매 관련 콘텐츠 확인':'한국 관련 콘텐츠 확인')+'</span><small>상세 보기 ↗</small>';return el}
function start(){clear();if(paused||!visible||document.hidden)return;running=true;if(legacy)legacyHTML();else current()}
addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent)return;if(event.data==='scout:pause'){paused=true;clear();canvas.getAnimations({subtree:true}).forEach(a=>a.pause())}if(event.data==='scout:play'||event.data==='scout:replay'){paused=false;start()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)clear();else start()});reduced.addEventListener('change',start);start();
})();
</script></body></html>
