6h3.692V4.631zM27.354 0h-5.2v3.692h5.17c.53 0 .984.4.984.939v5.215H32V4.631A4.624 4.624 0 0027.354 0zm.954 24.83c0 .532-.4.94-.939.94h-5.215v3.768h5.215c2.577 0 4.631-2.13 4.631-4.707v-5.139h-3.692v5.139zm-23.677.94c-.531 0-.939-.4-.939-.94v-5.138H0v5.139c0 2.577 2.13 4.707 4.708 4.707h5.138V25.77H4.631z\">\u003c/path>\u003c/svg>\u003c/button>\u003cbutton class=\"react-flow__controls-button readable-scale\" aria-label=\"읽기 편한 크기로 보기\" title=\"읽기 편한 크기 (100%)\">1:1\u003c/button>\u003c/div>\u003cdiv id=\"react-flow__node-desc-1\" style=\"display:none\">Press enter or space to select a node. You can then use the arrow keys to move the node around. Press delete to remove it and escape to cancel.\u003c/div>\u003cdiv id=\"react-flow__edge-desc-1\" style=\"display:none\">Press enter or space to select an edge. You can then press delete to remove it or escape to cancel.\u003c/div>\u003cdiv id=\"react-flow__aria-live-1\" aria-live=\"assertive\" aria-atomic=\"true\" style=\"position:absolute;width:1px;height:1px;margin:-1px;border:0;padding:0;overflow:hidden;clip:rect(0px, 0px, 0px, 0px);clip-path:inset(100%)\">\u003c/div>\u003c/div>\u003cdiv class=\"map-reading-guide\">\u003cspan class=\"map-path-key\">\u003c/span>빨간 선은 선택한 경로예요\u003cspan class=\"map-pan-hint\">드래그하여 이동\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003caside class=\"detail-panel\" role=\"complementary\" aria-labelledby=\"detail-title-civil-payment\">\u003cdiv class=\"mobile-sheet-handle\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"detail-head\">\u003cspan class=\"stage-pill stage-keyword\">지급명령 신청\u003c/span>\u003cbutton class=\"icon-btn\" title=\"설명 닫기\" aria-label=\"설명 닫기\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-x\">\u003cpath d=\"M18 6 6 18\">\u003c/path>\u003cpath d=\"m6 6 12 12\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003cdiv class=\"detail-scroll\">\u003cdiv class=\"detail-title-block\">\u003ch2 id=\"detail-title-civil-payment\">지급명령으로 요청하기\u003c/h2>\u003cp class=\"detail-summary\">\u003cstrong>서류 심사로 지급을 요청해요.\u003c/strong>\u003c/p>\u003c/div>\u003cdl class=\"detail-metrics\">\u003cdiv>\u003cdt>예상 기간\u003c/dt>\u003cdd>전체 약 4~8주\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>절차\u003c/dt>\u003cdd>\u003cb>3\u003c/b>단계\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"detail-deadline\">\u003cb aria-hidden=\"true\">기한\u003c/b>\u003cspan>전달받은 뒤 이의 기간 2주\u003c/span>\u003c/p>\u003csection class=\"detail-block flow-block\">\u003ch3 class=\"detail-label\">이렇게 흘러가요\u003c/h3>\u003col class=\"scenario-timeline\">\u003cli>\u003cspan class=\"timeline-number\">\u003cspan class=\"timeline-digit\">1\u003c/span>\u003c/span>\u003cdiv>\u003cstrong>신청·서류 심사\u003c/strong>\u003cp>받을 돈과 이유를 적어 신청해요. 보완 요청이 오면 내용을 고쳐요.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cspan class=\"timeline-number\">\u003cspan class=\"timeline-digit\">2\u003c/span>\u003c/span>\u003cdiv>\u003cstrong>상대에게 전달\u003c/strong>\u003cp>법원이 지급명령을 보내요. 전달되지 않으면 주소를 고쳐 다시 보내거나 소송으로 넘길지 확인해요.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cspan class=\"timeline-number\">\u003cspan class=\"timeline-digit\">3\u003c/span>\u003c/span>\u003cdiv>\u003cstrong>이의 여부 확인\u003c/strong>\u003cp>상대가 서류를 받은 뒤 2주 안에 이의하는지에 따라 다음 과정이 달라져요.\u003c/p>\u003c/div>\u003c/li>\u003c/ol>\u003c/section>\u003csection class=\"detail-block detail-results-block\">\u003cdiv class=\"detail-results-grid\">\u003cdiv class=\"detail-results-column\">\u003ch3 class=\"detail-label\">가능한 결과\u003c/h3>\u003cul class=\"detail-outcomes\">\u003cli>\u003cstrong>이의 없이 확정\u003c/strong>\u003csmall>상대가 기한 안에 이의하지 않으면\u003c/small>\u003cp>강제집행의 근거가 될 수 있어요. 그래도 돈을 주지 않으면 재산에서 실제로 받는 절차를 따로 살펴봐요.\u003c/p>\u003c/li>\u003cli>\u003cstrong>다투면 소송으로\u003c/strong>\u003csmall>상대가 적법하게 이의하면\u003c/small>\u003cp>소송으로 넘어가 주장과 증거를 다퉈요. 처음 신청했다고 곧바로 돈을 받는 것은 아니에요.\u003c/p>\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"detail-block\">\u003ch3 class=\"detail-label\">다른 방법 알아보기\u003c/h3>\u003cdiv class=\"detail-links\">\u003cbutton class=\"detail-link\">\u003cspan>\u003cstrong>바로 소송으로 다투기\u003c/strong>\u003csmall>상대가 적법하게 이의하거나, 송달 문제로 소송 이행을 검토할 때\u003c/small>\u003c/span>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-right\">\u003cpath d=\"m9 18 6-6-6-6\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003c/section>\u003cdetails class=\"detail-fold\">\u003csummary>\u003cspan>준비할 것 · 주의사항\u003c/span>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-down fold-chevron\">\u003cpath d=\"m6 9 6 6 6-6\">\u003c/path>\u003c/svg>\u003c/summary>\u003cdiv class=\"detail-fold-body\">\u003cdiv class=\"fold-group\">\u003ch4>이 방법이 맞는 상황\u003c/h4>\u003cp>상대가 돈을 갚아야 한다는 점을 크게 다투지 않고, 서류를 보낼 주소도 알 때 먼저 비교해 볼 수 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"fold-group\">\u003ch4>상세 조건과 설명\u003c/h4>\u003cp>상대가 이의하면 소송으로 넘어가요.\u003c/p>\u003c/div>\u003cdiv class=\"fold-group\">\u003ch4>시작하기 전에\u003c/h4>\u003cul>\u003cli>지급기일과 청구금액을 확인하고, 신청서에 쓸 상대방 주소와 근거 자료를 정리해요.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"fold-group\">\u003ch4>필요한 자료\u003c/h4>\u003cul class=\"fold-documents\">\u003cli>\u003cdiv class=\"fold-doc-name\">\u003cstrong>지급명령 신청서\u003c/strong>\u003cspan class=\"doc-tag required\">필수\u003c/span>\u003c/div>\u003cp>누구에게 얼마를, 어떤 이유로 청구하는지 법원에 알리는 문서예요.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"fold-doc-name\">\u003cstrong>계약서·차용증·송금 내역\u003c/strong>\u003cspan class=\"doc-tag helpful\">도움\u003c/span>\u003c/div>\u003cp>돈을 받을 이유와 금액을 설명하는 데 도움이 돼요. 가진 자료부터 정리해요.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"fold-doc-name\">\u003cstrong>상대가 채무를 인정한 대화\u003c/strong>\u003cspan class=\"doc-tag helpful\">도움\u003c/span>\u003c/div>\u003cp>금액이나 갚기로 한 날짜가 담긴 부분을 날짜와 함께 보관해요.\u003c/p>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"fold-group\">\u003ch4>예상 기간과 기한\u003c/h4>\u003cul>\u003cli>기한 — 전달받은 뒤 이의 기간 2주 · 상대가 지급명령을 받은 날부터 세는 대응 기한이에요. 신청부터 회수까지 끝나는 기간을 뜻하지 않아요.\u003c/li>\u003cli>달라지는 조건 — 전체 기간은 송달·이의 여부에 따라 · 주소를 고치거나 소송으로 넘어가면 더 오래 걸릴 수 있어요.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"fold-group\">\u003ch4>주의사항\u003c/h4>\u003cul>\u003cli>상대가 이미 돈을 빌린 사실이나 금액을 다투고 있다면 이의 후 소송이 될 가능성까지 비교해요. 처음부터 소송으로 진행하는 편이 나을지, 같은 자료를 다시 준비해야 하는지도 살펴봐요.\u003c/li>\u003cli>상대방 주소가 불명확하면 지급명령이 전달되지 않아 절차가 멈출 수 있어요. 알고 있는 주소가 현재 주소인지 확인하고, 법원에서 오는 보완 요청을 놓치지 않아요.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"detail-fold\">\u003csummary>\u003cspan>법률 근거\u003c/span>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-down fold-chevron\">\u003cpath d=\"m6 9 6 6 6-6\">\u003c/path>\u003c/svg>\u003c/summary>\u003cdiv class=\"detail-fold-body\">\u003cdiv class=\"detail-sources\">\u003ca href=\"https://ecfs.scourt.go.kr/psp/index.on?m=PSP730M12\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cspan>\u003cstrong>법원 · 지급명령 절차\u003c/strong>\u003cp>지급명령 신청부터 전달·이의·확정까지의 과정을 설명해요. 상대가 서류를 받은 뒤 2주 안에 적법하게 이의하면 소송으로 넘어가요.\u003c/p>\u003csmall>공식 안내\u003c/small>\u003c/span>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-external-link\">\u003cpath d=\"M15 3h6v6\">\u003c/path>\u003cpath d=\"M10 14 21 3\">\u003c/path>\u003cpath d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003cdiv class=\"step-actions\">\u003cbutton class=\"step-primary\" aria-busy=\"false\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-right\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"m12 5 7 7-7 7\">\u003c/path>\u003c/svg>\u003cspan>이 방법으로 진행\u003c/span>\u003c/button>\u003c/div>\u003c/aside>\u003c/section>\u003c/div>\u003c/main>","steps":"\u003cmain class=\"app-shell light mobile-chat chat-collapsed\" data-theme=\"light\">\u003caside class=\"workspace-rail\" aria-label=\"기본 메뉴\">\u003cdiv class=\"rail-brand\" title=\"법률 로드맵\" aria-label=\"법률 로드맵\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-git-branch\">\u003cline x1=\"6\" x2=\"6\" y1=\"3\" y2=\"15\">\u003c/line>\u003ccircle cx=\"18\" cy=\"6\" r=\"3\">\u003c/circle>\u003ccircle cx=\"6\" cy=\"18\" r=\"3\">\u003c/circle>\u003cpath d=\"M18 9a9 9 0 0 1-9 9\">\u003c/path>\u003c/svg>\u003c/div>\u003cnav class=\"rail-menu\" aria-label=\"작업 메뉴\">\u003cbutton class=\"rail-button rail-new\" aria-label=\"새 대화\" title=\"새 대화\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-plus\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"M12 5v14\">\u003c/path>\u003c/svg>\u003cspan>새 대화\u003c/span>\u003c/button>\u003cdiv class=\"case-switch-wrap\">\u003cbutton class=\"rail-button\" aria-label=\"대화 기록\" aria-expanded=\"false\" aria-pressed=\"false\" title=\"대화 기록\">\u003csvg xml (()=>{
 const snapshots=JSON.parse(document.getElementById('actual-states').textContent);
 const host=document.getElementById('actual-ui');
 const scene=new URLSearchParams(location.search).get('scene')||'steps';
 const sequences={steps:[['overview',2400],['route',2600],['steps',6500]],timing:[['route',4500],['steps',2500],['deadline',5500]],branches:[['overview',1500],['route',2000],['steps',2500],['outcomeOne',3500],['outcomeTwo',3500],['fork',3500]]};
 const sequence=sequences[scene]||sequences.steps;
 const motion=matchMedia('(prefers-reduced-motion:reduce)');
 let playing=parent===window,started=false,index=0,elapsed=0,last=performance.now(),phase='';
 function render(name,animate=true){
  if(name===phase)return;
  const previous=host.querySelector('.react-flow__viewport')?.style.transform;
  const template=document.createElement('template');template.innerHTML=snapshots[name];
  const viewport=template.content.querySelector('.react-flow__viewport');
  const destination=viewport?.style.transform;
  if(animate&&previous&&viewport&&!motion.matches)viewport.style.transform=previous;
  host.replaceChildren(template.content);phase=name;document.documentElement.dataset.phase=name;
  if(animate&&previous&&viewport&&!motion.matches)requestAnimationFrame(()=>requestAnimationFrame(()=>{
   viewport.style.transition='transform 600ms cubic-bezier(.2,.7,.2,1)';viewport.style.transform=destination;
  }));
 }
 function sync(){
  const active=playing&&!document.hidden&&!motion.matches;
  document.documentElement.dataset.playback=active?'playing':'paused';
  if(active&&!started){started=true;index=0;elapsed=0;render(sequence[0][0],false)}
  last=performance.now();
 }
 // The paused preview is a complete real state, rather than a loading frame.
 render(scene==='timing'?'deadline':scene==='branches'?'outcomeTwo':'steps',false);
 sync();
 setInterval(()=>{
  const now=performance.now(),delta=now-last;last=now;
  if(!playing||document.hidden||motion.matches)return;
  elapsed+=delta;
  if(elapsed>=sequence[index][1]){elapsed=0;index=(index+1)%sequence.length;render(sequence[index][0])}
 },100);
 addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==parent)return;
  if(event.data==='law:play'){playing=true;sync()}
  if(event.data==='law:pause'){playing=false;sync()}
 });
 document.addEventListener('visibilitychange',sync);motion.addEventListener('change',sync);
 parent.postMessage({type:'law:ready',scene},location.origin);
})();
</script></body></html>
